<!DOCTYPE html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biz Mate — Sổ kế toán Bà Lan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!--
      R5 Kyle: critical CSS in <head> so chips/HITL never glue before module JS injects Tailwind.
      Full tokens still load via main.ts → style.css (Vite/PostCSS).
    -->
    <style id="bizmate-critical">
      :root {
        color-scheme: dark;
        --background: 222 47% 6%;
        --foreground: 210 40% 96%;
        --card: 217 33% 12%;
        --primary: 207 58% 59%;
        --muted-foreground: 215 16% 65%;
        --border: 217 25% 22%;
        --ok: 152 60% 48%;
        --warn: 40 80% 55%;
        --radius: 0.75rem;
      }
      html { background: hsl(var(--background)); color: hsl(var(--foreground)); }
      body {
        margin: 0; min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: hsl(var(--background)); color: hsl(var(--foreground));
      }
      #app { margin: 0 auto; max-width: 48rem; padding: 1.5rem 1rem; }
      .chip-row {
        display: flex; flex-wrap: wrap; align-items: center;
        gap: 0.5rem 0.65rem; margin-bottom: 1rem;
      }
      .chip-sep {
        display: inline-block; color: hsl(var(--muted-foreground));
        opacity: 0.55; font-weight: 700; user-select: none; padding: 0 0.1rem;
      }
      .chip {
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: 9999px; border: 1.5px solid hsl(var(--border));
        background: hsl(var(--background) / 0.9); color: hsl(var(--muted-foreground));
        padding: 0.4rem 0.85rem; font-size: 0.8rem; font-weight: 600;
        white-space: nowrap; line-height: 1.1;
      }
      .chip.active { border-color: hsl(var(--primary)); color: hsl(var(--primary)); background: hsl(var(--primary) / 0.12); }
      .chip.done { border-color: hsl(var(--ok) / 0.7); color: hsl(var(--ok)); background: hsl(var(--ok) / 0.12); }
      .chip.busy { border-color: hsl(var(--warn) / 0.7); color: hsl(var(--warn)); background: hsl(var(--warn) / 0.12); }
      .ops-rail {
        position: sticky; top: 0; z-index: 40; margin-bottom: 1rem;
        border-radius: var(--radius);
        border: 1px solid hsl(var(--primary) / 0.35);
        background: hsl(var(--card) / 0.96);
        box-shadow: 0 8px 24px hsl(222 47% 4% / 0.45);
      }
      .ops-rail .metric-strip {
        display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem;
      }
      @media (min-width: 640px) {
        .ops-rail .metric-strip { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .chip { font-size: 0.875rem; padding-left: 1rem; padding-right: 1rem; }
      }
      .metric-tile {
        border-radius: var(--radius); border: 1px solid hsl(var(--border));
        background: hsl(var(--background) / 0.6); padding: 0.75rem;
      }
      .metric-tile dt {
        margin: 0; font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.05em; color: hsl(var(--muted-foreground));
      }
      .metric-tile dd {
        margin: 0.25rem 0 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 1rem; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- R7 AI-OPS: AI đang đề xuất · đã verify · AI đề xuất (stub offline) · runtime deterministic · không LLM · ops-rail -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
